[changelog]
header = """
# Changelog
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
	# [{{ version | split(pat="-v") | last | trim_start_matches(pat="v") }}]\
	{% if previous %}\
		{% if previous.version %}\
			(https://github.com/NedcloarBR/NestWhats/compare/{{ previous.version }}...{{ version }})\
		{% else %}
			(https://github.com/NedcloarBR/NestWhats/tree/{{ version }})\
		{% endif %}\
	{% endif %} \
	- ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
	# [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
	## {{ group | striptags | trim | upper_first }}
	{% for commit in commits %}
		- {% if commit.breaking %}**[breaking]** {% endif %}\
		  {% if commit.scope %}\
			**{{commit.scope}}:** \
		  {% endif %}\
			{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/NedcloarBR/NestWhats/commit/{{ commit.id }}))\
		{% if commit.breaking %}\
			{% for breakingChange in commit.footers %}\
				{% if breakingChange.breaking %}\
					\n{% raw %}  {% endraw %}- **{{ breakingChange.token }}{{ breakingChange.separator }}** {{ breakingChange.value }}\
				{% endif %}\
			{% endfor %}\
		{% endif %}\
	{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
	{ message = "^feat", group = "<!-- 00 -->Features" },
	{ message = "^fix", group = "<!-- 01 -->Bug Fixes" },
	{ message = "^perf", group = "<!-- 02 -->Performance" },
	{ message = "^refactor", group = "<!-- 03 -->Refactor" },
	{ message = "^typings", group = "<!-- 04 -->Typings" },
	{ message = "^types", group = "<!-- 04 -->Typings" },
	{ body = ".*security", group = "<!-- 05 -->Security" },
	{ message = ".*deprecated", body = ".*deprecated", group = "<!-- 06 -->Deprecation" },
	{ message = "^docs", group = "<!-- 07 -->Documentation" },
	{ message = "^style", group = "<!-- 08 -->Styling" },
	{ message = "^test", group = "<!-- 09 -->Testing" },
	{ message = "^revert", skip = true },
	{ message = "^chore", skip = true },
	{ message = "^ci", skip = true },
	{ message = "^build", skip = true },
]
filter_commits = true
# Default covers every package tag scheme; each package invocation narrows it
# down with --tag-pattern so one package's releases never leak into another's range.
tag_pattern = "^((messaging|locale|dashboard|platform-wwjs|webhook)-v|v)[0-9]+"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
