name: Continuous Integration

on:
  push:
    branches: [master]
    paths-ignore: [".github/**"]
  pull_request:
    paths-ignore: [".github/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor the packages declare: the first release where a
        # CommonJS consumer can require() an ES module unflagged. 22 is current.
        node: ["20.19", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node v${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-node${{ matrix.node }}-nx-${{ hashFiles('tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-nx-${{ hashFiles('tsconfig.json') }}-

      - name: Run BiomeJS
        run: yarn lint

      # Ahead of the build, so a type error is reported as one rather than as a
      # failed emit — and so the packages that only `noEmit` are covered too.
      - name: Typecheck all packages
        run: yarn typecheck

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test
